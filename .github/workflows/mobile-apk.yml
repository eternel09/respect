name: Build Mobile APK

# Construit l'APK Android de l'app scanner (Expo/React Native) sur les runners
# GitHub — sans Expo cloud ni Play Store — et le publie en asset de Release.
on:
  workflow_dispatch:
  push:
    tags: ['mobile-v*']

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Prebuild (generate android project)
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Collect APK
        run: cp android/app/build/outputs/apk/release/app-release.apk signiq-scanner.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: signiq-scanner-apk
          path: mobile/signiq-scanner.apk

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mobile-latest
          name: Signiq Scanner (APK)
          body: |
            APK de l'application scanner Signiq.
            Pointé sur l'API de production https://signiq.saas.cd
            (modifiable à l'écran de connexion).
          files: mobile/signiq-scanner.apk
