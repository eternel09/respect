server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 25M;

    # Compression
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # API : reverse-proxy vers le backend Laravel (même origine, pas de CORS).
    # resolver = DNS interne Docker → ré-résolution du conteneur "backend"
    # à l'exécution (robuste aux redémarrages).
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $upstream http://backend:8080;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Cache long pour les assets fingerprintés
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA : toute route inconnue renvoie index.html (React Router côté client)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
